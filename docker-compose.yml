# The Market: course environment
# Start:  docker compose --profile core up -d
# Stop:   docker compose --profile core down        (your data is kept)
# Reset:  docker compose --profile core down -v     (deletes the databases, they are rebuilt on the next start)

services:

  # PostgreSQL: The Market's source database
  market-db:
    image: postgres:16
    profiles: [core]
    environment:
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD}
      POSTGRES_DB: market
    ports:
      - "127.0.0.1:5433:5432"    # your laptop: localhost:5433  ->  inside Docker: market-db:5432
    volumes:
      - ./docker/seed/postgres:/docker-entrypoint-initdb.d:ro   # loads the data on the first start
      - market_data:/var/lib/postgresql/data                    # keeps the data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market"]
      interval: 5s
      timeout: 5s
      retries: 30

  # MongoDB: website reviews
  mongo:
    image: mongo:7
    profiles: [core]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: market
    ports:
      - "127.0.0.1:27018:27017"                  # your laptop: localhost:27018  ->  inside Docker: mongo:27017
    volumes:
      - ./docker/seed/mongo:/docker-entrypoint-initdb.d:ro      # loads the reviews on the first start
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # pgAdmin: view and query PostgreSQL in the browser at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [core]
    environment:
      PGADMIN_DEFAULT_EMAIL: student@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro  # the market-db connection, ready to use
    depends_on:
      market-db:
        condition: service_healthy

  # mongo-express: view MongoDB in the browser at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    profiles: [core]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  market_data:
  mongo_data:
